; mypy config for the jdevera.truenas collection.
;
; Patterned on the community.general PR #10997 setup. The goal is
; pragmatic adoption: enable mypy in CI so future PRs are validated,
; without forcing fully-annotated module code today.

[mypy]
strict_equality = True
strict_bytes = True
warn_redundant_casts = True
warn_unreachable = True
ignore_missing_imports = False

; Ansible collections lay out plugins as siblings under plugins/.
; explicit_package_bases lets mypy treat action/certificate.py and
; modules/certificate.py as distinct modules instead of a duplicate.
;
; mypy_path points one level above the collection (NAMESPACE/) so the
; relative imports inside plugins/ ('from ..module_utils import setup')
; resolve as 'ansible_collections.jdevera.truenas.plugins.module_utils'
; the same way Ansible's collection loader resolves them at runtime.
; The Makefile 'mypy' target sets this up via the compatibility-link.
explicit_package_bases = True
namespace_packages = True

; Strict-mode rules left commented for gradual adoption. Enable as
; coverage of type hints in the codebase grows.
; check_untyped_defs = True
; disallow_untyped_defs = True

; ansible-core is partially typed; let mypy follow it without
; requiring full annotation coverage on its modules.
[mypy-ansible.*]
follow_untyped_imports = True

; Third-party libraries that don't ship stubs. Add entries here as
; needed; runtime deps for this collection are intentionally tiny so
; the list stays short.
[mypy-middlewared.*]
ignore_missing_imports = True

[mypy-truenas_api_client]
ignore_missing_imports = True
