# Pre-commit hooks for jdevera.truenas.
#
# One-shot status:    pre-commit run --all-files
# Auto-run on commit: pre-commit install   (one-time, per checkout)
#
# pre-commit runs every configured hook regardless of earlier failures, so a
# single invocation gives the full picture: each hook reports Passed / Failed
# with its own output inlined under the failing entry.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: make typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: ansible-doc
        name: ansible-doc parses every module
        entry: make check-docs
        language: system
        types: [python]
        pass_filenames: false

      - id: validate-modules
        name: ansible-test validate-modules
        entry: make validate
        language: system
        types: [python]
        pass_filenames: false
