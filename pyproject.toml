[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "docs",
    "docs-site",
    "venv-docs",
    "changelogs",
    "ansible_collections",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
# SIM (flake8-simplify) is intentionally not enabled: most of its
# rewrites (ternaries, nested-if merges) hurt readability of the
# verbose conditional chains common in Ansible module code.
ignore = [
    "E501",   # line length: handled by ruff's own limit; long strings/comments are fine
    "E402",   # Ansible modules put DOCUMENTATION/EXAMPLES/RETURN strings before imports
]
